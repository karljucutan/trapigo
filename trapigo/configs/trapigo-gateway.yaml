http:
  # Simple Global Rate Limiting Configuration. Rate Limiting in production is better configurable per service
  rate-limit:
    enabled: true
    token-bucket:
      capacity: 100
      refill-rate: 100
      refill-interval-in-seconds: 60

  routers:
    users-router:
      path-prefix: /api/v1/users
      service: users-service

    go-orders-router:
      path-prefix: /api/v1/go-orders
      service: orders-service

    dotnet10-aot-orders-router:
      path-prefix: /api/v1/dotnet10-aot-orders
      service: orders-service
 
  services:
    users-service:
      load-balancer:
        servers:
          - url: http://app-one:8080

    orders-service:
      load-balancer:
        servers:
          - url: http://app-two:8080