http:
  # Simple Global Rate Limiting Configuration. Rate Limiting in production is better configurable per service
  rate-limit:
    enabled: true
    token-bucket:
      capacity: 300
      refill-rate: 1.67
      refill-interval-in-seconds: 1

  routers:
    keycloak-router:
      path-prefix: /auth
      service: keycloak

    go-orders-router:
      path-prefix: /api/v1/go-orders
      service: go-order-service

    dotnet10aot-orders-router:
      path-prefix: /api/v1/dotnet10-aot-orders
      service: dotnet10aot-order-service

  services:
    keycloak:
      load-balancer:
        servers:
          - url: http://keycloak:8080
      
    go-order-service:
      load-balancer:
        servers:
          # Docker Internal DNS (Leverages Docker's built-in DNS round-robin)
          # - url: http://go-order-service:8080
          
          # Custom Gateway Load Balancing (Bypasses Docker DNS to run our own Round-Robin)
          - url: http://trapigo-monorepo-go-order-service-1:8080
          - url: http://trapigo-monorepo-go-order-service-2:8080
          - url: http://trapigo-monorepo-go-order-service-3:8080

    dotnet10aot-order-service:
      load-balancer:
        servers:
          - url: http://dotnet10aot-order-service:8080

keycloak:
  issuer_url: http://localhost:8081/auth/realms/CompanyRealmA
  internal_realm_url: http://keycloak:8080/auth/realms/CompanyRealmA
  client_id: trapigo-apigateway
  client_secret: nNHJna7snaxYCL62mKLwC5fRFnuEe6ma5RBWANyZElxknyXhM2dyMgCR01oVTP7hPzt69DfRZd0RKJhgfwPN7s # Secret; use a secret store outside local development.
  redirect_uri: http://localhost:8081/web/auth/callback

auth:
  cookie_secure: false
  cookie_same_site: Lax
  state_expiration_seconds: 600
  jwt_cache_ttl_seconds: 3600
  required_scopes: []
  frontend_redirect_url: http://localhost:3000

allowed_origins:
  values:
    - http://localhost:3000