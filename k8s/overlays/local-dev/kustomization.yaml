apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../base
  - local-secrets.yaml
sortOptions:
  order: fifo
images:
  - name: localhost/trapigo
    newTag: dev
patches:
  - target:
      group: apps
      version: v1
      kind: Deployment
      name: trapigo-services-db
    patch: |
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: trapigo-services-db
      spec:
        template:
          spec:
            containers:
              - name: postgres
                ports:
                  - name: postgres
                    containerPort: 5432
                    hostPort: 5432
  - target:
      group: apps
      version: v1
      kind: Deployment
      name: keycloak-db
    patch: |
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: keycloak-db
      spec:
        template:
          spec:
            containers:
              - name: postgres
                ports:
                  - name: postgres
                    containerPort: 5432
                    hostPort: 5433
  - target:
      group: apps
      version: v1
      kind: Deployment
      name: trapigo
    patch: |
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: trapigo
      spec:
        template:
          metadata:
            annotations:
              container.seccomp.security.alpha.kubernetes.io/trapigo: unconfined
          spec:
            containers:
              - name: trapigo
                env:
                  - name: LOG_LEVEL
                    value: DEBUG
                ports:
                  - name: gateway
                    containerPort: 80
                    hostPort: 80
                  - name: admin
                    containerPort: 8080
                    hostPort: 8080
                  - name: delve
                    containerPort: 40000
                    hostPort: 40000
                volumeMounts:
                  - name: trapigo-configs
                    mountPath: /app/configs
                    readOnly: true
            volumes:
              - name: trapigo-configs
                hostPath:
                  # Local-only source; the path must exist inside the Kind node.
                  path: ./trapigo/configs
                  type: Directory
