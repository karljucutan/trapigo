apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../base
  - local-secrets.yaml
sortOptions:
  order: fifo
images:
  - name: localhost/trapigo
    newTag: dev
configMapGenerator:
  - name: trapigo-gateway-config
    behavior: replace
    files:
      - trapigo-gateway-kube.yaml=gateway-config.yaml
patches:
  - target:
      group: apps
      version: v1
      kind: Deployment
      name: trapigo-services-db
    patch: |
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: trapigo-services-db
      spec:
        template:
          spec:
            containers:
              - name: postgres
                ports:
                  - name: postgres
                    containerPort: 5432
                    hostPort: 5432
  - target:
      group: apps
      version: v1
      kind: Deployment
      name: keycloak-db
    patch: |
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: keycloak-db
      spec:
        template:
          spec:
            containers:
              - name: postgres
                ports:
                  - name: postgres
                    containerPort: 5432
                    hostPort: 5433
  - target:
      group: apps
      version: v1
      kind: Deployment
      name: trapigo
    patch: |
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: trapigo
      spec:
        template:
          spec:
            containers:
              - name: trapigo
                env:
                  - name: LOG_LEVEL
                    value: DEBUG
                ports:
                  - name: gateway
                    containerPort: 80
                    hostPort: 8081
                  - name: admin
                    containerPort: 8080
                    hostPort: 8080
                  - name: delve
                    containerPort: 40000
                    hostPort: 40000
  - target:
      group: apps
      version: v1
      kind: Deployment
    patch: |
      - op: replace
        path: /apiVersion
        value: v1
      - op: replace
        path: /kind
        value: Pod
      - op: move
        from: /spec/template/spec
        path: /spec
  - target:
      version: v1
      kind: Service
    patch: |
      $patch: delete
      apiVersion: v1
      kind: Service
      metadata:
        name: unused
  - target:
      version: v1
      kind: ServiceAccount
    patch: |
      $patch: delete
      apiVersion: v1
      kind: ServiceAccount
      metadata:
        name: unused
  - target:
      group: rbac.authorization.k8s.io
      version: v1
      kind: Role
    patch: |
      $patch: delete
      apiVersion: rbac.authorization.k8s.io/v1
      kind: Role
      metadata:
        name: unused
  - target:
      group: rbac.authorization.k8s.io
      version: v1
      kind: RoleBinding
    patch: |
      $patch: delete
      apiVersion: rbac.authorization.k8s.io/v1
      kind: RoleBinding
      metadata:
        name: unused
  - target:
      version: v1
      kind: Pod
      name: trapigo
    patch: |
      - op: add
        path: /metadata/annotations
        value:
          container.seccomp.security.alpha.kubernetes.io/trapigo: unconfined
      - op: remove
        path: /spec/serviceAccountName
      - op: remove
        path: /spec/containers/0/env/0
