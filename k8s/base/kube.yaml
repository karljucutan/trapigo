# Kubernetes control loop: Deployments reconcile ReplicaSets; ReplicaSets create Pods.
# A Service selects matching Pods by labels and provides stable DNS/load balancing.
# A PVC requests persistent storage from the cluster's StorageClass/provisioner.
# ==============================================================================
# Persistent Storage: Services Database and Keycloak Database
# ==============================================================================
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: pgdata-trapigo-services
spec:
  accessModes:
  - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: pgdata-keycloak
spec:
  accessModes:
  - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi
---
# ==============================================================================
# Trapigo Services Database: Deployment and Service
# ==============================================================================
# Deployment controller -> ReplicaSet -> PostgreSQL Pod; the Pod mounts its PVC.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: trapigo-services-db
spec:
  replicas: 1
  selector:
    matchLabels:
      app: trapigo-services-db
  template: # pod template
    metadata:
      labels:
        app: trapigo-services-db
    spec:
      containers:
      - name: postgres
        image: postgres:18-alpine
        ports:
        - name: postgres
          containerPort: 5432
        env:
        - name: POSTGRES_USER
          valueFrom:
            secretKeyRef:
              name: trapigo-monorepo-secrets
              key: SERVICES_DB_USER
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: trapigo-monorepo-secrets
              key: SERVICES_DB_PASSWORD
        - name: POSTGRES_DB
          valueFrom:
            secretKeyRef:
              name: trapigo-monorepo-secrets
              key: SERVICES_DB_NAME
        volumeMounts:
        - name: pgdata
          mountPath: /var/lib/postgresql
        readinessProbe:
          exec:
            command:
            - sh
            - -c
            - pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB"
          initialDelaySeconds: 3
          periodSeconds: 4
          timeoutSeconds: 4
          failureThreshold: 5
        livenessProbe:
          exec:
            command:
            - sh
            - -c
            - pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB"
          initialDelaySeconds: 15
          periodSeconds: 10
          timeoutSeconds: 4
      volumes:
      - name: pgdata
        persistentVolumeClaim:
          claimName: pgdata-trapigo-services
---
# Stable in-cluster endpoint: trapigo-services-db:5432 -> matching PostgreSQL Pod.
apiVersion: v1
kind: Service
metadata:
  name: trapigo-services-db
spec:
  selector:
    app: trapigo-services-db
  ports:
  - name: postgres
    port: 5432
    targetPort: 5432
---
# ==============================================================================
# Keycloak Database: Deployment and Service
# ==============================================================================
# Deployment controller -> ReplicaSet -> PostgreSQL Pod; the Pod mounts its PVC.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: keycloak-db
spec:
  replicas: 1
  selector:
    matchLabels:
      app: keycloak-db
  template: # pod template
    metadata:
      labels:
        app: keycloak-db
    spec:
      containers:
      - name: postgres
        image: postgres:18-alpine
        ports:
        - name: postgres
          containerPort: 5432
        env:
        - name: POSTGRES_USER
          valueFrom:
            secretKeyRef:
              name: trapigo-monorepo-secrets
              key: KC_DB_USER
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: trapigo-monorepo-secrets
              key: KC_DB_PASSWORD
        - name: POSTGRES_DB
          valueFrom:
            secretKeyRef:
              name: trapigo-monorepo-secrets
              key: KC_DB_NAME
        volumeMounts:
        - name: pgdata
          mountPath: /var/lib/postgresql
        readinessProbe:
          exec:
            command:
            - sh
            - -c
            - pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB"
          initialDelaySeconds: 3
          periodSeconds: 4
          timeoutSeconds: 4
          failureThreshold: 5
        livenessProbe:
          exec:
            command:
            - sh
            - -c
            - pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB"
          initialDelaySeconds: 15
          periodSeconds: 10
          timeoutSeconds: 4
      volumes:
      - name: pgdata
        persistentVolumeClaim:
          claimName: pgdata-keycloak
---
# Stable in-cluster endpoint: keycloak-db:5432 -> matching PostgreSQL Pod.
apiVersion: v1
kind: Service
metadata:
  name: keycloak-db
spec:
  selector:
    app: keycloak-db
  ports:
  - name: postgres
    port: 5432
    targetPort: 5432
---
# ==============================================================================
# Keycloak: Deployment and Service
# ==============================================================================
# Deployment controller -> ReplicaSet -> Keycloak Pod.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: keycloak
spec:
  replicas: 1
  selector:
    matchLabels:
      app: keycloak
  template: # pod template
    metadata:
      labels:
        app: keycloak
    spec:
      containers:
      - name: keycloak
        image: quay.io/keycloak/keycloak:latest
        args:
        - start-dev
        ports:
        - name: http
          containerPort: 8080
        envFrom:
        - configMapRef:
            name: keycloak-env
        env:
        - name: KC_DB_URL_DATABASE
          valueFrom:
            secretKeyRef:
              name: trapigo-monorepo-secrets
              key: KC_DB_NAME
        - name: KC_DB_USERNAME
          valueFrom:
            secretKeyRef:
              name: trapigo-monorepo-secrets
              key: KC_DB_USER
        - name: KC_DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: trapigo-monorepo-secrets
              key: KC_DB_PASSWORD
        - name: KC_BOOTSTRAP_ADMIN_USERNAME
          valueFrom:
            secretKeyRef:
              name: trapigo-monorepo-secrets
              key: KC_BOOTSTRAP_ADMIN_USERNAME
        - name: KC_BOOTSTRAP_ADMIN_PASSWORD
          valueFrom:
            secretKeyRef:
              name: trapigo-monorepo-secrets
              key: KC_BOOTSTRAP_ADMIN_PASSWORD
        readinessProbe:
          httpGet:
            path: /auth/
            port: 8080
          initialDelaySeconds: 20
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 12
---
# Stable in-cluster endpoint: keycloak:8080 -> ready Keycloak Pod(s).
apiVersion: v1
kind: Service
metadata:
  name: keycloak
spec:
  selector:
    app: keycloak
  ports:
  - name: http
    port: 8080
    targetPort: 8080
---
# ==============================================================================
# Trapigo API Gateway: Deployment and Service
# ==============================================================================
# Deployment controller -> ReplicaSet -> gateway Pod.
# ServiceAccount gives the gateway Pod an identity for Kubernetes API calls.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: trapigo
---
# Namespace-scoped permission for startup discovery of Service EndpointSlices.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: trapigo-endpoint-discovery
rules:
- apiGroups:
  - discovery.k8s.io
  resources:
  - endpointslices
  verbs:
  - list
---
# Grants the gateway ServiceAccount the EndpointSlice list permission above.
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: trapigo-endpoint-discovery
subjects:
- kind: ServiceAccount
  name: trapigo
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: trapigo-endpoint-discovery
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: trapigo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: trapigo
  template: # pod template
    metadata:
      labels:
        app: trapigo
    spec:
      # Uses the ServiceAccount granted permission by the RoleBinding above.
      serviceAccountName: trapigo
      containers:
      - name: trapigo
        image: localhost/trapigo:prod
        imagePullPolicy: IfNotPresent
        ports:
        - name: gateway
          containerPort: 80
        - name: admin
          containerPort: 8080
        envFrom:
        - configMapRef:
            name: trapigo-gateway-env
        env:
        # client-go uses this namespace when listing the backend EndpointSlices.
        - name: POD_NAMESPACE
          valueFrom:
            fieldRef:
              fieldPath: metadata.namespace
        - name: KEYCLOAK_CLIENT_SECRET
          valueFrom:
            secretKeyRef:
              name: trapigo-monorepo-secrets
              key: KEYCLOAK_CLIENT_SECRET
        volumeMounts:
        - name: trapigo-configs
          mountPath: /app/configs
          readOnly: true
      volumes:
      - name: trapigo-configs
        configMap:
          name: trapigo-gateway-config
---
# Stable in-cluster endpoint; local-dev adds hostPort bindings in its overlay.
apiVersion: v1
kind: Service
metadata:
  name: trapigo
spec:
  selector:
    app: trapigo
  ports:
  - name: gateway
    port: 80
    targetPort: 80
  - name: admin
    port: 8080
    targetPort: 8080
---
# ==============================================================================
# Go Order Service: Deployment and Service
# ==============================================================================
# Deployment controller -> ReplicaSet -> 3 API Pods; the Service selector below
# matches each Pod's app label so Kubernetes can publish their endpoints.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: go-order-service
spec:
  replicas: 3
  selector:
    matchLabels:
      app: go-order-service
  template: # pod template
    metadata:
      labels:
        app: go-order-service
    spec:
      containers:
      - name: go-order-service
        image: localhost/go-order-service:latest
        imagePullPolicy: IfNotPresent
        ports:
        # This port name must match kubernetes.port in trapigo-gateway-kube.yaml.
        - name: http
          containerPort: 8080
        envFrom:
        - configMapRef:
            name: go-order-service-env
        env:
        - name: DB_DSN
          valueFrom:
            secretKeyRef:
              name: trapigo-monorepo-secrets
              key: ORDER_DB_DSN
---
# The gateway discovers Pod IPs from EndpointSlices belonging to this Service.
# selector must match the Deployment's Pod-template labels above.
apiVersion: v1
kind: Service
metadata:
  name: go-order-service
spec:
  selector:
    app: go-order-service
  ports:
  # The named Service port is matched with kubernetes.port in the gateway config.
  - name: http
    port: 8080
    targetPort: 8080
