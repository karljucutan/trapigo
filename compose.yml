name: trapigo-monorepo

services:
  ### Observability
  jaeger:
    image: docker.io/jaegertracing/jaeger:2.20.0
    command: ["--config=/etc/jaeger/config.yaml"]
    environment:
      JAEGER_MEMORY_MAX_TRACES: "${JAEGER_MEMORY_MAX_TRACES:-10000}"
    volumes:
      - ./observability/jaeger-config.yaml:/etc/jaeger/config.yaml:ro,Z
    ports:
      - "127.0.0.1:16686:16686"

  otel-collector:
    image: docker.io/otel/opentelemetry-collector-contrib:0.163.1
    command: ["--config=/etc/otelcol-contrib/config.yaml"]
    stop_grace_period: 30s
    volumes:
      - ./observability/otel-collector-config.yaml:/etc/otelcol-contrib/config.yaml:ro,Z
    depends_on:
      - jaeger

  prometheus:
    image: docker.io/prom/prometheus:v3.15.0
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=${PROMETHEUS_RETENTION_TIME:-7d}"
      - "--storage.tsdb.retention.size=${PROMETHEUS_RETENTION_SIZE:-2GB}"
    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro,Z
      - prometheus-data:/prometheus
    ports:
      - "127.0.0.1:9090:9090"
    depends_on:
      - otel-collector

  grafana:
    image: docker.io/grafana/grafana:13.2.4
    environment:
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_SECURITY_ADMIN_USER: "${GRAFANA_ADMIN_USER:-admin}"
      GF_SECURITY_ADMIN_PASSWORD: "${GRAFANA_ADMIN_PASSWORD:-admin}"
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro,Z
      - grafana-data:/var/lib/grafana
    ports:
      - "127.0.0.1:3001:3000"
    depends_on:
      - prometheus
      - jaeger
  ### Observability

  ### IAM
  keycloak-db:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: keycloak
      POSTGRES_DB: keycloak
    ports:
      - "5433:5432"
    volumes:
      - pgdata-keycloak:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U keycloak -d keycloak"]
      interval: 4s
      timeout: 4s
      retries: 5

  keycloak:
    image: quay.io/keycloak/keycloak:latest
    command: ["start-dev"] # Develolment mode; for production, use "start" command.
    environment:
      KC_DB: postgres
      KC_DB_URL_HOST: keycloak-db
      KC_DB_URL_PORT: 5432
      KC_DB_URL_DATABASE: keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: keycloak # Secret; use a secret store outside local development.
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin # Secret; use a secret store outside local development.
      KC_HTTP_RELATIVE_PATH: /auth
      KC_PROXY_HEADERS: xforwarded
    # ports: # Removed as Keycloak will be accessed through the main gateway "TRAPIGO".
    #   - "8000:8080"
    depends_on:
      keycloak-db:
        condition: service_healthy
  ### IAM

  trapigo-services-db:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
    ports:
    - "5432:5432"
    volumes:
      - pgdata-trapigo-services:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 4s
      timeout: 4s
      retries: 5

  trapigo:
    build:
      context: .
      dockerfile: ./trapigo/Dockerfile
      target: prod # Defaults to the production/compiled stage
    ports:
      - "8081:80"      # Main gateway entrypoint (http://localhost:8081/)
      - "8080:8080"    # Admin Dashboard / API UI (http://localhost:8080)
    environment:
      - LOG_LEVEL=INFO
      - BASE_URL=http://localhost
      - PORT=80
      - TRAPIGO_GATEWAY_CONFIG=/app/configs/trapigo-gateway.yaml
      # --- Downstream Timeouts (Client to Trapigo) ---
      - READ_HEADER_TIMEOUT=5     # Crucial for Slowloris protection
      - READ_TIMEOUT=0            # 0 means disabled; let the handler/stream control body uploads
      - WRITE_TIMEOUT=0           # 0 means disabled; allows streaming and slow clients
      - IDLE_TIMEOUT=180          # 3 minutes; good balance for keep-alive connection reuse
      # --- Upstream Timeouts (Trapigo to Backends) ---
      - BACKEND_DIAL_TIMEOUT=5    # Max time to connect to a backend service container
      - BACKEND_TIMEOUT=30        # Max time a backend has to process and return a response
    # Mount the example/default YAML config into the container and point the app to it explicitly.
    # This lets each deployment override the file with its own routing config by changing the env var or mounting a different file.
    volumes:
      - ./trapigo/configs:/app/configs:ro,Z

  go-order-service:
    build:
      context: .
      dockerfile: ./go-order-service/Dockerfile
    environment:
      - HOST=0.0.0.0
      - PORT=8080
      - DB_DSN=postgres://postgres:postgres@trapigo-services-db:5432/go-order-service?sslmode=disable
      - APP_ENV=docker
      - LOG_LEVEL=INFO
    depends_on:
      trapigo-services-db:
        condition: service_healthy
    deploy:
      mode: replicated
      replicas: 3

  # Example: rename to actual proj name.
  # go-crud-app:
  #   build:
  #     context: ./go-crud-app
  #     dockerfile: Dockerfile
  #     target: prod # Defaults to the production/compiled stage

volumes:
  pgdata-trapigo-services:
  pgdata-keycloak:
  prometheus-data:
  grafana-data:
